<section class="pb-16 bg-gray-50">
  <div class="container xl:w-[95%]">
    <h2 class="text-3xl md:text-4xl font-bold text-center text-main
         mb-8 tracking-wide
         drop-shadow-sm
         transition-colors duration-300">
      Shop Popular Categories
    </h2>

    <div class="mt-6">
      <owl-carousel-o [options]="categoriesCustomoption">

        @for (category of categoriesList(); track category._id) {
        <ng-template carouselSlide [id]="category._id">
          <div class="group bg-white rounded-2xl p-4
           border border-6
           shadow-sm hover:shadow-md
           transition-all duration-300 ease-in-out">

            <!-- Image -->
            <div class="relative w-full aspect-square rounded-xl
             bg-6 overflow-hidden
             flex items-center justify-center">

              <img [src]="category.image" [alt]="category.name" [title]="category.name" class="max-w-[85%] max-h-[85%]
               object-contain
               transition-transform duration-500
               group-hover:scale-105" />
            </div>

            <!-- Name -->
            <h3 class="mt-4 text-center text-sm font-medium
             text-cecond
             group-hover:text-main
             transition-colors duration-300">
              {{ category.name }}
            </h3>

          </div>
        </ng-template>


        }
      </owl-carousel-o>
    </div>
  </div>

</section>
